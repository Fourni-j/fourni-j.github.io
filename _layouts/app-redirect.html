{% assign redirect_url = page.redirect_to | absolute_url %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.app_name | escape }}</title>
    <meta name="robots" content="noindex,follow">
    <meta http-equiv="refresh" content="0; url={{ redirect_url | escape }}">
    <link rel="canonical" href="{{ redirect_url | split: '#' | first | escape }}">
</head>
<body>
    <main>
        <h1>{{ page.app_name | escape }}</h1>
        <p><a href="{{ redirect_url | escape }}">{{ page.redirect_label | default: 'View on the App Store' | escape }}</a>.</p>
    </main>
</body>
</html>
