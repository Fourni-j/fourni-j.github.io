---
layout: default
---

<div id="content" class="site-content fadeInDown delay_075s">
    <main id="main" class="site-main outer">
        <article class="post-full inner-wide rides-page">
            <header class="post-header">
                <h1 class="post-title">{{ page.title }}</h1>
                {% if page.description %}<p class="rides-intro">{{ page.description }}</p>{% endif %}
            </header>
            <div class="post-content">
                {{ content }}
                {% include rides.html %}
            </div>
        </article>
    </main>
</div>
