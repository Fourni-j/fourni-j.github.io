---
layout: default
---
<article class="home-article home-container">
    <header class="home-article-header">
        <h1>{{ page.title | escape }}</h1>
    </header>
    {% if page.featured_image and page.featured_image != '' %}
    <figure class="home-article-cover">
        <img src="{{ page.featured_image | relative_url }}" alt="{{ page.featured_image_alt | default: page.title | escape }}" fetchpriority="high" decoding="async">
    </figure>
    {% endif %}
    <div class="home-prose">{{ content }}</div>
</article>
