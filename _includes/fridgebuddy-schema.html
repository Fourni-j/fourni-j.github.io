{% assign app_store_url = page.app_store_url | default: t.app_store_url %}
{% if page.schema_type == "app" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "MobileApplication",
      "@id": "{{ include.canonical_url }}#app",
      "name": {{ page.app_name | default: "FridgeBuddy" | jsonify }},
      "alternateName": "Pantry & Fridge: FridgeBuddy",
      "description": {{ include.meta_description | strip_html | strip_newlines | jsonify }},
      "url": "{{ include.canonical_url }}",
      "downloadUrl": {{ app_store_url | jsonify }},
      "installUrl": {{ app_store_url | jsonify }},
      "image": "{{ '/assets/app-pages/fridgebuddy-icon.png' | absolute_url }}",
      "screenshot": [{{ page.preview_file | absolute_url | jsonify }}{% for screenshot in page.screenshots %}, {{ screenshot.image | absolute_url | jsonify }}{% endfor %}],
      "softwareVersion": {{ site.data.fridgebuddy.version | jsonify }},
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "iOS {{ site.data.fridgebuddy.minimum_os }} or later; iPadOS {{ site.data.fridgebuddy.minimum_os }} or later",
      "author": {
        "@type": "Person",
        "name": "Charles-Adrien Fournier",
        "url": "{{ '/' | absolute_url }}"
      },
      "offers": {
        "@type": "Offer",
        "url": {{ app_store_url | jsonify }},
        "price": 0,
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": {{ site.data.fridgebuddy.rating_value }},
        "ratingCount": {{ site.data.fridgebuddy.rating_count }},
        "bestRating": 5,
        "worstRating": 1
      }
    }{% if page.faq %},
    {
      "@type": "FAQPage",
      "@id": "{{ include.canonical_url }}#faq",
      "mainEntity": [
        {% for item in page.faq %}{
          "@type": "Question",
          "name": {{ item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ item.answer | strip_html | jsonify }}
          }
        }{% unless forloop.last %},{% endunless %}{% endfor %}
      ]
    }{% endif %}
  ]
}
</script>
{% elsif page.schema_type == "calculator" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebApplication",
      "@id": "{{ include.canonical_url }}#calculator",
      "name": {{ page.title | jsonify }},
      "description": {{ include.meta_description | strip_html | strip_newlines | jsonify }},
      "url": "{{ include.canonical_url }}",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": 0,
        "priceCurrency": "USD"
      },
      "about": {
        "@id": "{{ '/fridgebuddy/' | absolute_url }}#app"
      }
    },
    {% include fridgebuddy-webpage-schema.json canonical_url=include.canonical_url meta_description=include.meta_description %}
  ]
}
</script>
{% elsif page.schema_type == "web_page" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {% include fridgebuddy-webpage-schema.json canonical_url=include.canonical_url meta_description=include.meta_description %}
  ]
}
</script>
{% endif %}
