<script>

$(function() {
    $.ajax({
        url: "https://itunes.apple.com/lookup",
        data: { id: {{ include.appid | strip | jsonify }} },
        dataType: "jsonp",
        timeout: 10000
    }).done(function(json) {

        if (json.results && json.results.length) {

            var appInfo = json.results[0];

            {% unless app_icon %}
            $('link[rel="shortcut icon"]').attr("href", appInfo.artworkUrl512);
            {% endunless %}

            // Set page title using the iOS app ID if it is not set manually in _config.yml
            var $pageTitle = $(".pageTitle");
            if ($pageTitle.text().trim().length == 0) {
                $pageTitle.text(appInfo.trackName);
            }

            // Set large app icon using the iOS app ID if it is not set manually in _config.yml
            var $appIconLarge = $(".appIconLarge");
            if (!$appIconLarge.attr('src')) {
                $($appIconLarge).attr("src", appInfo.artworkUrl512);
            }

            // Set header app icon using the iOS app ID if it is not set manually in _config.yml
            var $appIconHeader = $(".headerIcon");
            if (!$appIconHeader.attr('src')) {
                $($appIconHeader).attr("src", appInfo.artworkUrl512);
            }

            {% unless app_icon %}
            $(".modern-header-app-icon, .modern-app-icon").attr("src", appInfo.artworkUrl512);
            {% endunless %}

            // Set app name using the iOS app ID if it is not set manually in _config.yml
            var $appName = $(".appName");
            var $headerName = $(".headerName");
            if ($appName.text().trim().length == 0) {
                $appName.text(appInfo.trackName);
                $headerName.text(appInfo.trackName);
            }

            // Keep authored app names; the lookup only fills missing values.
            $(".modern-header-app-name, .modern-app-title").each(function() {
                if (!$(this).text().trim()) $(this).text(appInfo.trackName);
            });

            // Set price using the iOS app ID if it is not set manually in _config.yml
            var $appPrice = $(".appPrice");
            if ($appPrice.text().trim().length == 0) {
                $appPrice.text(appInfo.formattedPrice);
            }

            // Set App Store link using the iOS app ID if it is not set manually in _config.yml
            var $appStoreLink = $(".appStoreLink");
            if (($appStoreLink.attr('href') || '').trim().length == 0) {
                $($appStoreLink).attr("href", appInfo.trackViewUrl);
            }

            // Set app rating display if enabled
            var showRating = {% if page.show_rating %}true{% else %}false{% endif %};
            
            if (showRating && appInfo.averageUserRating && appInfo.userRatingCount) {
                var rating = parseFloat(appInfo.averageUserRating);
                var ratingCount = parseInt(appInfo.userRatingCount);
                
                // Generate star rating HTML
                var starsHtml = '';
                for (var i = 1; i <= 5; i++) {
                    if (i <= Math.floor(rating)) {
                        starsHtml += '<i class="fas fa-star"></i>';
                    } else if (i - 0.5 <= rating) {
                        starsHtml += '<i class="fas fa-star-half-alt"></i>';
                    } else {
                        starsHtml += '<i class="far fa-star"></i>';
                    }
                }
                
                var ratingHtml = '<div class="modern-app-rating">' +
                    '<div class="modern-rating-stars">' + starsHtml + '</div>' +
                    '<span class="modern-rating-text">' + rating.toFixed(1) + ' (' + ratingCount.toLocaleString() + ' reviews)</span>' +
                    '</div>';
                
                $(".modern-app-rating-container").html(ratingHtml);
            }

        }
    }).fail(function() {
        // Authored content and App Store links remain usable if the lookup fails.
        console.warn("App Store details are temporarily unavailable.");
    });
});

</script>
