text:
  en:
    hub_title: "How long food lasts in the fridge and freezer"
    hub_page_title: "Food storage chart: fridge and freezer times | FridgeBuddy"
    hub_meta: "How long raw meat, poultry, fish, eggs, deli meat and leftovers keep in the fridge and freezer, based on the USDA cold food storage chart."
    hub_intro: "Fridge and freezer times for the foods people most often forget, taken from the USDA cold food storage chart. Pick a food for storage tips and freezing advice."
    hub_crumb: Food storage guide
    title: "How long %{does} %{name} last in the fridge and freezer?"
    does: { singular: does, plural: do }
    keeps: { singular: keeps, plural: keep }
    page_title: "How long %{does} %{name} last? Fridge and freezer times"
    page_title_short: "How long %{does} %{name} last?"
    meta: "%{label}: %{fridge} in the fridge and %{freezer_short} in the freezer, according to USDA guidance. Storage, freezing and thawing tips."
    meta_nofreeze: "%{label}: %{fridge} in the fridge; %{freezer_short}, according to USDA guidance. Storage and safety tips."
    intro: "In short: %{name} %{keeps} %{fridge} in the refrigerator at 40°F (4°C) or below. %{freezer_sentence}"
    freezer_sentence: "Frozen at 0°F (−18°C), food stays safe indefinitely, and the best quality lasts %{freezer}."
    freezer_sentence_none: "%{freezer}."
    col_food: Food
    col_variant: Type
    col_fridge: "Fridge (40°F / 4°C)"
    col_freezer: "Freezer (0°F / −18°C)"
    or_use_by: "or the use-by date"
    durations:
      no_freeze: Do not freeze
      poor_freeze: Does not freeze well
      not_recommended: Freezing not recommended
      freeze_beaten: Do not freeze in the shell; beat yolks and whites together, then freeze
    durations_short:
      no_freeze: do not freeze
      poor_freeze: does not freeze well
      not_recommended: freezing not recommended
      freeze_beaten: freeze only out of the shell
    range: "%{min} to %{max}"
    units: { day: [day, days], week: [week, weeks], month: [month, months], year: [year, years] }
    times_heading: "Storage times at a glance"
    freezer_heading: "Freezer times are about quality, not safety"
    freezer_body: "Food kept continuously frozen at 0°F (−18°C) stays safe indefinitely because bacteria cannot grow. The freezer times above tell you how long the texture and flavor stay at their best. Label packages with the date you froze them so you know what to use first."
    refreeze_body: "Avoid freezing, thawing and refreezing the same food. Every cycle damages texture and flavor, and food that thawed outside the refrigerator gives bacteria a chance to grow. Raw food thawed in the refrigerator can be refrozen, with some loss of quality. Food thawed in cold water or in the microwave must be cooked before it goes back in the freezer. Never refreeze food that thawed on the counter or stayed out more than 2 hours. Freeze in small portions so you only thaw what you need."
    doubt_heading: "When in doubt, throw it out"
    doubt_body: "These times assume food was handled safely and refrigerated promptly. If the package shows a use-by date that comes sooner, follow the label. Trust your nose too: if food smells sour, rancid or simply off, or looks slimy or moldy, throw it out, even within these times. The reverse is not true: the bacteria that cause food poisoning usually do not change the smell or appearance, so food that smells fine past these times is not safe either. Never taste food to check whether it is still good."
    track_heading: "Never lose track of the date again"
    track_body: "The hard part is rarely knowing the rule; it is remembering when you put the food away. [FridgeBuddy](%{tracker_url}) lets you scan the barcode and printed date, choose how early you want a reminder, and see what to use first across your fridge, freezer and pantry."
    source: "Source: [USDA cold food storage chart on FoodSafety.gov](%{url}), last reviewed by the agency on %{date}. This guide is for general information; always follow the label and your local food-safety authority."
    source_date: "September 19, 2023"
    faq_fridge_q: "How long %{does} %{name} last in the fridge?"
    faq_fridge_a: "%{fridge_cap} at 40°F (4°C) or below, according to the USDA cold food storage chart."
    faq_freeze_q: "Can you freeze %{name}?"
    faq_freeze_yes: "Yes. Kept frozen at 0°F (−18°C), food stays safe indefinitely; for the best quality, use it within %{freezer}."
    faq_freeze_no: "%{freezer}. Refrigerate instead and use within %{fridge}."
    related_hub: "Food storage chart"
    related_hub_desc: "Fridge and freezer times for every food in this guide."
    related_tracker: "Food expiration tracker"
    related_tracker_desc: "Get reminded before food in your kitchen expires."
    related_food_desc: "Fridge and freezer storage times."
    tracker_url: /fridgebuddy/food-expiration-tracker/
    categories:
      poultry:
        name: Poultry
        heading: "How to store raw poultry"
        tips:
          - "Refrigerate poultry within 2 hours of buying it, or within 1 hour if it is above 90°F (32°C) outside."
          - "Keep it in its original packaging on the bottom shelf so juices cannot drip onto other food."
          - "For freezing longer than two months, overwrap the store package with foil or a freezer bag to prevent freezer burn."
          - "Thaw in the refrigerator, in cold water changed every 30 minutes, or in the microwave and cook it right away. Never thaw on the counter."
          - "Cook poultry to an internal temperature of 165°F (74°C)."
      meat:
        name: Meat
        heading: "How to store raw meat"
        tips:
          - "Refrigerate meat within 2 hours of buying it, or within 1 hour above 90°F (32°C)."
          - "Store it on the bottom shelf, in its packaging or a sealed container, away from ready-to-eat food."
          - "Wrap meat tightly or use freezer bags before freezing to limit freezer burn."
          - "Thaw in the refrigerator, in cold water changed every 30 minutes, or in the microwave and cook it immediately."
          - "Cook ground meat to 160°F (71°C), and steaks, chops and roasts to 145°F (63°C) with a three-minute rest."
      deli:
        name: Deli and cured meats
        heading: "How to store deli and cured meats"
        tips:
          - "Once a package is opened, the shorter opened-package time applies, whatever the date printed on the label."
          - "Reseal opened packages tightly or move them to an airtight container."
          - "Freeze in portions you can use at once; thawed deli meat is best used for cooking."
          - "People who are pregnant, older adults and people with weakened immunity should follow official advice on deli meats, such as heating them until steaming hot."
      seafood:
        name: Fish and seafood
        heading: "How to store fish and seafood"
        tips:
          - "Keep fresh fish and seafood in the coldest part of the refrigerator and use it quickly."
          - "Store live shellfish in a container covered with a damp cloth, never in an airtight bag or in water."
          - "Discard live shellfish whose shells are broken or stay open when tapped."
          - "Thaw frozen fish in the refrigerator overnight, or sealed in cold water if you need it sooner."
          - "Cook fish to 145°F (63°C), until the flesh is opaque and separates easily."
      eggs:
        name: Eggs
        heading: "How to store eggs"
        tips:
          - "Keep eggs in their original carton on a shelf in the main body of the refrigerator, not in the door."
          - "Do not wash eggs before storing them."
          - "Never freeze eggs in the shell. Beat yolks and whites together before freezing."
          - "Hard-boiled eggs keep one week in the refrigerator, peeled or not."
      cooked:
        name: Leftovers and cooked dishes
        heading: "How to store leftovers"
        tips:
          - "Refrigerate leftovers within 2 hours of cooking, or within 1 hour above 90°F (32°C)."
          - "Divide large batches into shallow containers so they cool quickly."
          - "Label containers with the date you cooked the food."
          - "Reheat leftovers to 165°F (74°C), and bring soups and sauces back to a boil."
  fr:
    hub_title: "Combien de temps se conservent les aliments au frigo et au congélateur ?"
    hub_page_title: "Durées de conservation au frigo et au congélateur | FridgeBuddy"
