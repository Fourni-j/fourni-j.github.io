    times_heading: "Les durées en un coup d'œil"
    freezer_heading: "Au congélateur, la durée concerne la qualité, pas la sécurité"
    freezer_body: "Un aliment maintenu en continu à −18 °C reste sûr indéfiniment, car les bactéries ne s'y développent pas. Les durées ci-dessus indiquent combien de temps la texture et le goût restent optimaux. Notez la date de congélation sur chaque sachet pour savoir quoi utiliser en premier."
    refreeze_body: "Évitez de congeler, décongeler puis recongeler un même aliment. Chaque cycle abîme la texture et le goût, et un aliment décongelé hors du réfrigérateur laisse aux bactéries le temps de se multiplier. Un aliment cru décongelé au réfrigérateur peut être recongelé, au prix d'une perte de qualité. Un aliment décongelé dans l'eau froide ou au micro-ondes doit être cuit avant de retourner au congélateur. Ne recongelez jamais un aliment décongelé sur le plan de travail ou resté plus de 2 heures à température ambiante. Congelez en petites portions pour ne décongeler que ce dont vous avez besoin."
    doubt_heading: "Dans le doute, jetez"
    doubt_body: "Ces durées supposent un aliment manipulé correctement et réfrigéré rapidement. Si l'emballage indique une date limite de consommation (DLC) plus proche, c'est elle qui compte. Fiez-vous aussi à votre nez : si un aliment sent l'aigre, le rance ou simplement mauvais, ou s'il est gluant ou moisi, jetez-le, même avant la fin de ces durées. L'inverse n'est pas vrai : les bactéries responsables des intoxications ne changent généralement ni l'odeur ni l'aspect, donc un aliment qui sent bon après ces délais n'est pas sûr pour autant. Ne goûtez jamais un aliment pour vérifier s'il est encore bon."
    track_heading: "Ne perdez plus jamais la date de vue"
    track_body: "Le plus difficile n'est pas de connaître la règle, mais de se souvenir du jour où l'on a rangé l'aliment. [FridgeBuddy](%{tracker_url}) vous permet de scanner le code-barres et la date imprimée, de choisir quand être prévenu et de voir quoi consommer en premier, du frigo au congélateur en passant par les placards."
    source: "Source : [tableau de conservation au froid de l'USDA sur FoodSafety.gov](%{url}) (en anglais), revu par l'agence le %{date}. Ce guide est donné à titre informatif ; suivez toujours l'étiquette et les recommandations des autorités sanitaires de votre pays."
    source_date: "19 septembre 2023"
    faq_fridge_q: "Combien de temps %{does} %{name} au frigo ?"
