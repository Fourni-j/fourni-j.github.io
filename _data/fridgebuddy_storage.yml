        heading: "Bien conserver les restes"
        tips:
          - "Mettez les restes au réfrigérateur dans les 2 heures suivant la cuisson, ou dans l'heure au-dessus de 32 °C."
          - "Répartissez les grandes quantités dans des récipients peu profonds pour qu'elles refroidissent vite."
          - "Notez la date de préparation sur chaque boîte."
          - "Réchauffez les restes jusqu'à 74 °C à cœur et portez soupes et sauces à ébullition."
  de:
    hub_title: "Wie lange sind Lebensmittel im Kühlschrank und Gefrierschrank haltbar?"
    hub_page_title: "Haltbarkeit im Kühlschrank und Gefrierschrank | FridgeBuddy"
    hub_meta: "Wie lange rohes Fleisch, Geflügel, Fisch, Eier, Aufschnitt und Essensreste im Kühlschrank und Gefrierschrank haltbar sind, laut der Lagertabelle des USDA."
    hub_intro: "Lagerzeiten im Kühlschrank und Gefrierschrank für die Lebensmittel, die am häufigsten vergessen werden, aus der Kühllagertabelle des US-Landwirtschaftsministeriums (USDA). Wählen Sie ein Lebensmittel für Tipps zu Lagerung und Einfrieren."
