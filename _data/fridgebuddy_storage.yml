    range: "%{min} bis %{max}"
    units: { day: [Tag, Tage], week: [Woche, Wochen], month: [Monat, Monate], year: [Jahr, Jahre] }
    times_heading: "Lagerzeiten auf einen Blick"
    freezer_heading: "Im Gefrierschrank geht es um Qualität, nicht um Sicherheit"
    freezer_body: "Lebensmittel, die durchgehend bei −18 °C gelagert werden, bleiben unbegrenzt sicher, weil sich Bakterien nicht vermehren. Die Zeiten oben geben an, wie lange Konsistenz und Geschmack optimal bleiben. Beschriften Sie Gefrierbeutel mit dem Einfrierdatum, damit Sie wissen, was zuerst verbraucht werden sollte."
    refreeze_body: "Vermeiden Sie es, dasselbe Lebensmittel einzufrieren, aufzutauen und wieder einzufrieren. Jeder Durchgang schadet Konsistenz und Geschmack, und außerhalb des Kühlschranks aufgetaute Lebensmittel geben Bakterien Zeit, sich zu vermehren. Rohe Lebensmittel, die im Kühlschrank aufgetaut wurden, dürfen mit etwas Qualitätsverlust wieder eingefroren werden. In kaltem Wasser oder in der Mikrowelle Aufgetautes muss vor dem erneuten Einfrieren gegart werden. Frieren Sie nie Lebensmittel wieder ein, die bei Raumtemperatur aufgetaut sind oder länger als 2 Stunden ungekühlt waren. Frieren Sie in kleinen Portionen ein, damit Sie nur auftauen, was Sie brauchen."
    doubt_heading: "Im Zweifel wegwerfen"
    doubt_body: "Diese Zeiten setzen voraus, dass das Lebensmittel hygienisch behandelt und rasch gekühlt wurde. Steht auf der Packung ein früheres Verbrauchsdatum, gilt dieses. Verlassen Sie sich auch auf Ihre Nase: Riecht ein Lebensmittel sauer, ranzig oder einfach unangenehm, oder ist es schmierig oder verschimmelt, werfen Sie es weg, auch innerhalb dieser Zeiten. Umgekehrt gilt das nicht: Krankmachende Bakterien verändern Geruch und Aussehen meist nicht, ein unauffälliges Lebensmittel ist nach Ablauf dieser Zeiten also trotzdem nicht sicher. Probieren Sie nie, ob etwas noch gut ist."
    track_heading: "Nie wieder ein Datum aus den Augen verlieren"
    track_body: "Schwierig ist selten die Regel, sondern sich zu merken, wann man etwas eingeräumt hat. Mit [FridgeBuddy](%{tracker_url}) scannen Sie Barcode und aufgedrucktes Datum, legen fest, wie früh Sie erinnert werden, und sehen über Kühlschrank, Gefrierschrank und Vorratsschrank hinweg, was zuerst weg muss."
    source: "Quelle: [Kühllagertabelle des USDA auf FoodSafety.gov](%{url}) (englisch), zuletzt von der Behörde geprüft am %{date}. Dieser Leitfaden dient der allgemeinen Information; beachten Sie immer das Etikett und die Empfehlungen Ihrer Lebensmittelbehörde."
    source_date: "19. September 2023"
    faq_fridge_q: "Wie lange %{does} %{name} im Kühlschrank haltbar?"
    faq_fridge_a: "%{fridge_cap} bei höchstens 4 °C, laut der Kühllagertabelle des USDA."
    faq_freeze_q: "Kann man %{name_acc} einfrieren?"
    faq_freeze_yes: "Ja. Bei −18 °C gelagert bleibt das Lebensmittel unbegrenzt sicher; für die beste Qualität höchstens %{freezer} einfrieren."
    faq_freeze_no: "%{freezer}. Besser im Kühlschrank lagern, dort hält es %{fridge}."
    related_hub: "Haltbarkeitstabelle"
    related_hub_desc: "Kühlschrank- und Gefrierzeiten für alle Lebensmittel dieses Leitfadens."
    related_tracker: "MHD-Tracker"
    related_tracker_desc: "Lassen Sie sich erinnern, bevor Lebensmittel ablaufen."
    related_food_desc: "Lagerzeiten im Kühlschrank und Gefrierschrank."
    tracker_url: /fridgebuddy/de/mhd-tracker/
    categories:
      poultry:
        name: Geflügel
        heading: "Rohes Geflügel richtig lagern"
        tips:
          - "Geflügel innerhalb von 2 Stunden nach dem Einkauf kühlen, bei über 32 °C innerhalb von 1 Stunde."
          - "In der Originalverpackung im untersten Fach lagern, damit kein Fleischsaft auf andere Lebensmittel tropft."
          - "Für mehr als zwei Monate im Gefrierschrank die Packung zusätzlich in Alufolie oder einen Gefrierbeutel wickeln, um Gefrierbrand zu vermeiden."
          - "Im Kühlschrank auftauen, in kaltem Wasser, das alle 30 Minuten gewechselt wird, oder in der Mikrowelle und sofort garen. Nie bei Raumtemperatur."
          - "Geflügel auf eine Kerntemperatur von 74 °C garen."
      meat:
        name: Fleisch
        heading: "Rohes Fleisch richtig lagern"
        tips:
          - "Fleisch innerhalb von 2 Stunden nach dem Einkauf kühlen, bei über 32 °C innerhalb von 1 Stunde."
          - "Im untersten Fach lagern, in der Verpackung oder einer geschlossenen Dose, getrennt von verzehrfertigen Lebensmitteln."
          - "Vor dem Einfrieren luftdicht verpacken oder Gefrierbeutel verwenden, um Gefrierbrand zu begrenzen."
          - "Im Kühlschrank auftauen, in kaltem Wasser, das alle 30 Minuten gewechselt wird, oder in der Mikrowelle und sofort garen."
          - "Hackfleisch auf 71 °C Kerntemperatur garen, Steaks, Koteletts und Braten auf 63 °C mit drei Minuten Ruhezeit."
      deli:
        name: Aufschnitt und Wurst
        heading: "Aufschnitt und Wurstwaren richtig lagern"
        tips:
          - "Nach dem Öffnen gilt die kürzere Lagerzeit für geöffnete Packungen, unabhängig vom aufgedruckten Datum."
          - "Geöffnete Packungen gut verschließen oder den Inhalt in eine luftdichte Dose umfüllen."
          - "In Portionen einfrieren, die auf einmal verbraucht werden; aufgetauter Aufschnitt eignet sich am besten zum Kochen."
          - "Schwangere, ältere Menschen und Menschen mit geschwächtem Immunsystem sollten die offiziellen Empfehlungen zu Aufschnitt befolgen, etwa ihn bis zum Dampfen zu erhitzen."
      seafood:
        name: Fisch und Meeresfrüchte
        heading: "Fisch und Meeresfrüchte richtig lagern"
        tips:
          - "Frischen Fisch und Meeresfrüchte im kältesten Bereich des Kühlschranks lagern und zügig verbrauchen."
          - "Lebende Muscheln in einem Gefäß unter einem feuchten Tuch aufbewahren, nie in einem verschlossenen Beutel oder in Wasser."
          - "Lebende Muscheln mit zerbrochener Schale oder solche, die sich beim Antippen nicht schließen, wegwerfen."
          - "Gefrorenen Fisch über Nacht im Kühlschrank auftauen oder, wenn es schneller gehen muss, verschlossen in kaltem Wasser."
          - "Fisch auf 63 °C garen, bis das Fleisch undurchsichtig ist und sich leicht teilen lässt."
      eggs:
        name: Eier
        heading: "Eier richtig lagern"
        tips:
          - "Eier im Originalkarton auf einem Fach im Kühlschrank lagern, nicht in der Tür."
          - "Eier vor dem Lagern nicht waschen."
          - "Eier nie in der Schale einfrieren. Eigelb und Eiweiß vorher verquirlen."
          - "Hartgekochte Eier halten sich geschält oder ungeschält eine Woche im Kühlschrank."
      cooked:
        name: Essensreste und gekochte Gerichte
        heading: "Essensreste richtig lagern"
        tips:
          - "Essensreste innerhalb von 2 Stunden nach dem Kochen kühlen, bei über 32 °C innerhalb von 1 Stunde."
          - "Große Mengen auf flache Behälter verteilen, damit sie schnell abkühlen."
          - "Behälter mit dem Kochdatum beschriften."
          - "Reste auf 74 °C erhitzen, Suppen und Soßen noch einmal aufkochen."
