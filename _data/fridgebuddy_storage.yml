    categories:
      poultry:
        name: Volaille
        heading: "Bien conserver la volaille crue"
        tips:
          - "Mettez la volaille au réfrigérateur dans les 2 heures suivant l'achat, ou dans l'heure s'il fait plus de 32 °C."
          - "Gardez-la dans son emballage d'origine, sur l'étagère du bas, pour que le jus ne coule pas sur les autres aliments."
          - "Pour une congélation de plus de deux mois, suremballez la barquette avec du papier aluminium ou un sac congélation pour éviter les brûlures de congélation."
          - "Décongelez au réfrigérateur, dans de l'eau froide changée toutes les 30 minutes, ou au micro-ondes en la cuisant aussitôt. Jamais sur le plan de travail."
          - "Cuisez la volaille jusqu'à 74 °C à cœur."
      meat:
        name: Viande
        heading: "Bien conserver la viande crue"
        tips:
          - "Mettez la viande au réfrigérateur dans les 2 heures suivant l'achat, ou dans l'heure au-dessus de 32 °C."
          - "Rangez-la sur l'étagère du bas, dans son emballage ou une boîte fermée, à l'écart des aliments prêts à consommer."
          - "Emballez-la hermétiquement ou utilisez des sacs congélation pour limiter les brûlures de congélation."
          - "Décongelez au réfrigérateur, dans de l'eau froide changée toutes les 30 minutes, ou au micro-ondes en la cuisant immédiatement."
          - "Cuisez la viande hachée jusqu'à 71 °C à cœur, et les steaks, côtes et rôtis jusqu'à 63 °C avec trois minutes de repos."
      deli:
        name: Charcuterie
        heading: "Bien conserver la charcuterie"
        tips:
          - "Une fois le paquet ouvert, c'est la durée « paquet ouvert » qui s'applique, quelle que soit la date imprimée."
          - "Refermez bien les paquets entamés ou transférez la charcuterie dans une boîte hermétique."
          - "Congelez en portions utilisables en une fois ; une fois décongelée, la charcuterie est meilleure cuisinée."
          - "Les femmes enceintes, les personnes âgées et les personnes immunodéprimées doivent suivre les recommandations officielles sur la charcuterie, par exemple la réchauffer jusqu'à ce qu'elle fume."
      seafood:
        name: Poisson et fruits de mer
        heading: "Bien conserver le poisson et les fruits de mer"
        tips:
          - "Placez poissons et fruits de mer frais dans la zone la plus froide du réfrigérateur et consommez-les rapidement."
          - "Conservez les coquillages vivants dans un récipient couvert d'un linge humide, jamais dans un sac fermé ni dans l'eau."
          - "Jetez les coquillages vivants dont la coquille est cassée ou reste ouverte quand on la tapote."
          - "Décongelez le poisson au réfrigérateur pendant la nuit, ou dans un sachet fermé plongé dans l'eau froide si vous êtes pressé."
          - "Cuisez le poisson jusqu'à 63 °C, quand la chair devient opaque et se détache facilement."
      eggs:
        name: Œufs
        heading: "Bien conserver les œufs"
        tips:
          - "Gardez les œufs dans leur boîte d'origine sur une étagère du réfrigérateur, pas dans la porte."
          - "Ne lavez pas les œufs avant de les ranger."
          - "Ne congelez jamais les œufs dans leur coquille. Battez blancs et jaunes ensemble avant de congeler."
          - "Les œufs durs se gardent une semaine au réfrigérateur, écalés ou non."
      cooked:
