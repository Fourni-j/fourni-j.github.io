# Bike rides shown on /rides/
#
# To add a ride:
#   1. Drop the GPX file in assets/rides/ (e.g. assets/rides/2026-09-01-my-ride.gpx)
#      Trim public start/end points near Métro Mairie des Lilas and check waypoints
#      so the download does not reveal a private address.
#   2. Add an entry below. Distance and elevation gain are computed from the GPX
#      in the browser, so you only need to fill the fields here.
#
# Fields:
#   name        – title of the ride
#   gpx         – path to the GPX file (relative to the site root)
#   date        – YYYY-MM-DD
#   type        – road | gravel
#   tags        – (optional) terrain characteristics, e.g. [Technique] or [Roulant]
#   color       – (optional) hex color for the trace on the map; otherwise auto-assigned
#   link        – (optional) URL to the ride on Komoot / Strava

