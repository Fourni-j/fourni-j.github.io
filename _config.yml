# Site settings
name: 'Charles-Adrien Fournier'
description: 'Charles-Adrien Fournier - iOS developer based in Paris'
favicon: 'assets/images/favicon.ico'
url: https://cafournier.com

# Author
author:
  name: 'Charles-Adrien Fournier'
  url: https://cafournier.com/

# Contact
email: charladfr@me.com

# Social links
github: 'fourni-j'
medium: '@charlesfournier'
instagram: 'charlesadrienf'
linkedin: 'charlesadrienfournier'
producthunt: '@charles_fournier1'

collections:
  posts:
    output: true
    permalink: /:title
  apps-pages:
    output: true
    permalink: /:path

# Pagination
paginate: 5
paginate_path: /page:num/

# Permalinks
permalink: /:title

exclude:
- .sass-cache/
- .jekyll-cache/
- gemfiles/
- Gemfile
- Gemfile.lock
- node_modules/
- vendor/bundle/
- vendor/cache/
- vendor/gems/
- vendor/ruby/
- _template/
- README.md
- AGENTS.md
- CLAUDE.md
- Makefile
- notes.md
- task_plan.md
- fridgebuddy-seo-deliverable.md
- tests/
- scripts/

# Other
markdown: kramdown

highlighter: rouge

# Sass
sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-tagsgenerator
  - jekyll-sitemap
  - jekyll-feed

twitter:
  username: CharladFournier
  card: summary
